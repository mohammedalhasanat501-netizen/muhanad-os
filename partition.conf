---
# SAFETY: only manual partitioning. No erase/replace/alongside auto modes.
# (availableChoices is honoured by Calamares >= 3.3; verify at runtime, see TEST-REPORT.)
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 300M
userSwapChoices: [ none, file ]
initialPartitioningChoice: none
initialSwapChoice: none
availableChoices: [ manual ]
allowManualPartitioning: true
alwaysShowPartitionLabels: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs" ]
requiredStorage: 20.0
